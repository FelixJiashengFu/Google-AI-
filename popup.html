<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>dadada</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #0A84FF;
      --blue-deep: #007AFF;
      --label: #1C1C1E;
      --secondary: #636366;
      --tertiary: #8E8E93;
      --separator: rgba(60, 60, 67, .12);
      --fill: rgba(120, 120, 128, .12);
    }
    * { box-sizing: border-box; }
    body {
      width: 316px;
      margin: 0;
      padding: 16px;
      background:
        radial-gradient(130% 90% at 100% 0%, rgba(90, 200, 250, .25), transparent 55%),
        radial-gradient(100% 80% at 0% 100%, rgba(191, 90, 242, .14), transparent 60%),
        #F2F2F7;
      color: var(--label);
      font: 12.5px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    header { display: flex; align-items: center; gap: 11px; margin-bottom: 13px; }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(145deg, #5AC8FA 0%, #0A84FF 38%, #5E5CE6 72%, #BF5AF2 100%);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 21px;
      color: #fff;
      box-shadow: 0 5px 14px rgba(10, 132, 255, .28), inset 0 1px 0 rgba(255, 255, 255, .45);
      flex: none;
      overflow: hidden;
    }
    h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.3px; }
    .status { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--tertiary); margin-top: 1px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #C7C7CC; }
    .dot.online { background: #30D158; box-shadow: 0 0 0 3px rgba(48, 209, 88, .14); }
    .page {
      padding: 10px 12px;
      border: .5px solid var(--separator);
      background: #fff;
      border-radius: 12px;
      color: var(--secondary);
      font-size: 11.5px;
      line-height: 1.55;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
    }
    button { font-family: inherit; cursor: pointer; }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      color: #fff;
      background: linear-gradient(180deg, #0A84FF, #007AFF);
      box-shadow: 0 4px 12px rgba(10, 132, 255, .3);
      transition: filter .15s ease, transform .1s ease;
    }
    .primary:hover { filter: brightness(1.06); }
    .primary:active { transform: translateY(1px); }
    .primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .row { display: flex; gap: 7px; margin-top: 8px; }
    .ghost {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--label);
      background: var(--fill);
    }
    .ghost:hover { background: rgba(120, 120, 128, .18); }
    .hint { margin: 12px 1px 0; font-size: 10.5px; color: var(--tertiary); line-height: 1.65; }
    .hint b { color: var(--blue-deep); font-weight: 600; }
    .warn { color: #FF375F; }
  </style>
</head>
<body>
  <header>
    <div class="logo">解</div>
    <div>
      <h1>dadada</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status">正在读取设置…</span></div>
    </div>
  </header>
  <div class="page" id="pageTitle">正在读取当前页面…</div>
  <button class="primary" id="toggle">打开讲解面板</button>
  <div class="row">
    <button class="ghost" id="settings">设置</button>
    <button class="ghost" id="refreshHint">使用说明</button>
  </div>
  <p class="hint"><b>选中文字</b>可划词讲解；<b>双击空格</b>截图并粘贴到 ChatGPT。<br><b>⌥⇧E</b> 开关面板 · <b>⌥⇧S</b> 截图</p>
  <script src="popup.js"></script>
</body>
</html>
